[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "binary-img-generator"
version = "0.1.0"
description = "A tool that converts a photo into a 0/1 portrait"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0.0", "numpy>=1.24.0"]

[project.scripts]
big = "binary_img_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
addopts = "--cov=binary_img_generator --cov-report=term-missing"
pythonpath = ["src"]